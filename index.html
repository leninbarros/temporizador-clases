<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Temporizador Pedagógico - Pomodoro de Aula</title>
  
  <!-- CONFIGURACIÓN PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Timer Clase">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #f8fafc;
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1e293b;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #38bdf8;
      flex-shrink: 0;
    }

    h1 {
      font-size: 20px;
      letter-spacing: 0.5px;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mode-selector {
      display: flex;
      background-color: #0f172a;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
      gap: 4px;
    }

    .mode-btn {
      background: none;
      border: none;
      color: #94a3b8;
      padding: 8px 16px;
      font-weight: bold;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background-color: #38bdf8;
      color: #0f172a;
    }

    main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 20px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      justify-content: space-between;
    }

    /* BARRA DE FASES */
    .phases-bar {
      display: flex;
      gap: 10px;
      width: 100%;
      flex-shrink: 0;
    }

    .phase-card {
      flex: 1;
      background-color: #1e293b;
      border: 2px solid #334155;
      border-radius: 12px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      opacity: 0.5;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .phase-card.active {
      opacity: 1;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .phase-card.completed {
      opacity: 0.8;
      border-color: #22c55e !important;
    }

    .phase-icon {
      font-size: 22px;
    }

    .phase-title {
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .phase-time {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
    }

    /* COLORES ESPECÍFICOS DE FASE */
    .theme-activacion { border-color: #22c55e; }
    .theme-activacion.active { background-color: #064e3b; border-color: #4ade80; }
    .theme-activacion .phase-title { color: #4ade80; }

    .theme-ensenanza { border-color: #38bdf8; }
    .theme-ensenanza.active { background-color: #0c4a6e; border-color: #38bdf8; }
    .theme-ensenanza .phase-title { color: #38bdf8; }

    .theme-pausa { border-color: #f43f5e; }
    .theme-pausa.active { background-color: #881337; border-color: #fb7185; }
    .theme-pausa .phase-title { color: #fb7185; }

    .theme-cierre { border-color: #a855f7; }
    .theme-cierre.active { background-color: #581c87; border-color: #c084fc; }
    .theme-cierre .phase-title { color: #c084fc; }

    /* ÁREA DEL TEMPORIZADOR */
    .timer-display-container {
      flex-grow: 1;
      background-color: #1e293b;
      border-radius: 20px;
      border: 3px solid #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 20px;
      overflow: hidden;
      transition: border-color 0.4s ease, background-color 0.4s ease;
    }

    .current-phase-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 10px;
      background-color: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .timer-digits {
      font-size: clamp(80px, 15vw, 160px);
      font-weight: 800;
      font-family: monospace, system-ui;
      letter-spacing: -2px;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
      line-height: 1;
    }

    .overall-progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 10px;
      background-color: #38bdf8;
      width: 0%;
      transition: width 0.3s linear;
    }

    /* CONTROLES DE MANDO */
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-main {
      background-color: #22c55e;
      min-width: 160px;
      justify-content: center;
      font-size: 20px;
    }
    .btn-main:hover { background-color: #16a34a; }
    .btn-main.paused { background-color: #eab308; }
    .btn-main.paused:hover { background-color: #ca8a04; }

    .btn-secondary {
      background-color: #334155;
      color: #f8fafc;
    }
    .btn-secondary:hover { background-color: #475569; }

    .sound-toggle {
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #38bdf8;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
    }

    .fullscreen-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
    }
    .fullscreen-btn:hover { color: #38bdf8; }

    @media (max-width: 768px) {
      .phases-bar {
        overflow-x: auto;
        padding-bottom: 5px;
      }
      .phase-card {
        min-width: 110px;
      }
      header {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>⏱️ Temporizador Pedagógico</h1>
    
    <div style="display: flex; align-items: center; gap: 12px;">
      <div class="mode-selector">
        <button class="mode-btn active" id="btn-1h" onclick="selectMode(1)">1 Hora (45 min)</button>
        <button class="mode-btn" id="btn-2h" onclick="selectMode(2)">2 Horas (90 min)</button>
      </div>
      <button class="fullscreen-btn" onclick="toggleFullscreen()" title="Pantalla Completa">⛶</button>
    </div>
  </header>

  <main>
    <!-- BARRA DINÁMICA DE FASES DE LA CLASE -->
    <div class="phases-bar" id="phases-bar"></div>

    <!-- PANTALLA PRINCIPAL DEL TEMPORIZADOR -->
    <div class="timer-display-container" id="timer-box">
      <div class="current-phase-badge" id="phase-badge">
        <span id="badge-icon">🧠</span>
        <span id="badge-text">Activación / Cálculo Mental</span>
      </div>

      <div class="timer-digits" id="timer-digits">05:00</div>

      <div class="overall-progress-bar" id="overall-progress"></div>
    </div>

    <!-- BOTONES DE CONTROL -->
    <div class="controls">
      <button class="btn btn-secondary" onclick="prevPhase()" title="Fase Anterior">⏮️ Anterior</button>
      
      <button class="btn btn-main" id="btn-start" onclick="toggleTimer()">
        <span>▶️</span> <span id="start-text">Iniciar</span>
      </button>
      
      <button class="btn btn-secondary" onclick="resetTimer()" title="Reiniciar Fase">🔄 Reiniciar</button>

      <button class="btn btn-secondary" onclick="nextPhase()" title="Siguiente Fase">Siguiente ⏭️</button>

      <button class="sound-toggle" id="sound-btn" onclick="toggleSound()" title="Activar/Desactivar Sonido">🔔</button>
    </div>
  </main>

  <script>
    const MODES = {
      1: [
        { id: 1, name: "Activación / Cálculo Mental", timeSec: 5 * 60, theme: "theme-activacion", icon: "🧠" },
        { id: 2, name: "Enseñanza Activa", timeSec: 35 * 60, theme: "theme-ensenanza", icon: "📖" },
        { id: 3, name: "Pausa Activa / Diversión", timeSec: 5 * 60, theme: "theme-pausa", icon: "🎮" }
      ],
      2: [
        { id: 1, name: "Activación / Cálculo Mental", timeSec: 5 * 60, theme: "theme-activacion", icon: "🧠" },
        { id: 2, name: "Enseñanza Activa (Hora 1)", timeSec: 35 * 60, theme: "theme-ensenanza", icon: "📖" },
        { id: 3, name: "Pausa Activa Extendida", timeSec: 10 * 60, theme: "theme-pausa", icon: "🎉" },
        { id: 4, name: "Enseñanza Activa (Hora 2)", timeSec: 35 * 60, theme: "theme-ensenanza", icon: "📖" },
        { id: 5, name: "Cierre / Pausa Activa Final", timeSec: 5 * 60, theme: "theme-cierre", icon: "🏁" }
      ]
    };

    let currentMode = 1;
    let currentPhaseIndex = 0;
    let timeRemaining = MODES[1][0].timeSec;
    let timerInterval = null;
    let isRunning = false;
    let soundEnabled = true;

    // AUDIO CON WEB AUDIO API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(freq = 587.33, duration = 0.3, type = 'sine') {
      if (!soundEnabled) return;
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playPhaseEndSound() {
      if (!soundEnabled) return;
      const notes = [587.33, 739.99, 880.00, 1174.66];
      notes.forEach((freq, i) => {
        setTimeout(() => playBeep(freq, 0.4, 'triangle'), i * 150);
      });
    }

    function init() {
      renderPhasesBar();
      updateDisplay();
    }

    function selectMode(mode) {
      if (isRunning) toggleTimer();
      currentMode = mode;
      document.getElementById('btn-1h').classList.toggle('active', mode === 1);
      document.getElementById('btn-2h').classList.toggle('active', mode === 2);
      currentPhaseIndex = 0;
      timeRemaining = MODES[currentMode][0].timeSec;
      renderPhasesBar();
      updateDisplay();
    }

    function renderPhasesBar() {
      const phasesBar = document.getElementById('phases-bar');
      phasesBar.innerHTML = '';
      const phases = MODES[currentMode];

      phases.forEach((phase, index) => {
        const minutes = Math.floor(phase.timeSec / 60);
        const card = document.createElement('div');
        card.className = `phase-card ${phase.theme} ${index === currentPhaseIndex ? 'active' : ''}`;
        card.id = `phase-card-${index}`;
        card.onclick = () => jumpToPhase(index);

        card.innerHTML = `
          <div class="phase-icon">${phase.icon}</div>
          <div class="phase-title">${phase.name}</div>
          <div class="phase-time">${minutes} min</div>
        `;
        phasesBar.appendChild(card);
      });
    }

    function updateDisplay() {
      const phase = MODES[currentMode][currentPhaseIndex];
      
      const mins = Math.floor(timeRemaining / 60);
      const secs = timeRemaining % 60;
      const formattedTime = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
      document.getElementById('timer-digits').innerText = formattedTime;
      document.title = `${formattedTime} - ${phase.name}`;

      document.getElementById('badge-icon').innerText = phase.icon;
      document.getElementById('badge-text').innerText = phase.name;

      const timerBox = document.getElementById('timer-box');
      timerBox.className = `timer-display-container ${phase.theme}`;

      const progressPercent = ((phase.timeSec - timeRemaining) / phase.timeSec) * 100;
      document.getElementById('overall-progress').style.width = `${progressPercent}%`;

      MODES[currentMode].forEach((_, idx) => {
        const card = document.getElementById(`phase-card-${idx}`);
        if (card) {
          card.classList.toggle('active', idx === currentPhaseIndex);
          card.classList.toggle('completed', idx < currentPhaseIndex);
        }
      });
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        document.getElementById('start-text').innerText = 'Reanudar';
        document.getElementById('btn-start').classList.add('paused');
      } else {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isRunning = true;
        document.getElementById('start-text').innerText = 'Pausar';
        document.getElementById('btn-start').classList.remove('paused');

        timerInterval = setInterval(() => {
          if (timeRemaining > 0) {
            timeRemaining--;
            updateDisplay();
            if (timeRemaining <= 3 && timeRemaining > 0) {
              playBeep(440, 0.15);
            }
          } else {
            playPhaseEndSound();
            if (currentPhaseIndex < MODES[currentMode].length - 1) {
              currentPhaseIndex++;
              timeRemaining = MODES[currentMode][currentPhaseIndex].timeSec;
              updateDisplay();
            } else {
              clearInterval(timerInterval);
              isRunning = false;
              document.getElementById('start-text').innerText = '¡Finalizado!';
            }
          }
        }, 1000);
      }
    }

    function resetTimer() {
      if (isRunning) toggleTimer();
      timeRemaining = MODES[currentMode][currentPhaseIndex].timeSec;
      document.getElementById('start-text').innerText = 'Iniciar';
      document.getElementById('btn-start').classList.remove('paused');
      updateDisplay();
    }

    function nextPhase() {
      if (currentPhaseIndex < MODES[currentMode].length - 1) {
        if (isRunning) toggleTimer();
        currentPhaseIndex++;
        timeRemaining = MODES[currentMode][currentPhaseIndex].timeSec;
        document.getElementById('start-text').innerText = 'Iniciar';
        document.getElementById('btn-start').classList.remove('paused');
        updateDisplay();
      }
    }

    function prevPhase() {
      if (currentPhaseIndex > 0) {
        if (isRunning) toggleTimer();
        currentPhaseIndex--;
        timeRemaining = MODES[currentMode][currentPhaseIndex].timeSec;
        document.getElementById('start-text').innerText = 'Iniciar';
        document.getElementById('btn-start').classList.remove('paused');
        updateDisplay();
      }
    }

    function jumpToPhase(index) {
      if (isRunning) toggleTimer();
      currentPhaseIndex = index;
      timeRemaining = MODES[currentMode][currentPhaseIndex].timeSec;
      document.getElementById('start-text').innerText = 'Iniciar';
      document.getElementById('btn-start').classList.remove('paused');
      updateDisplay();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('sound-btn').innerText = soundEnabled ? '🔔' : '🔕';
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    window.onload = init;
  </script>
</body>
</html>
